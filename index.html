      {name:'1-2-3 Bounce Spacing Drill',focus:'Movement',family:'bounceSpacing',goal:'Force constant foot adjustment and correct spacing by varying the allowed number of bounces.',steps:['Coach or partner feeds balls and calls “one,” “two,” or “three” on each feed.','Strike only after exactly that number of bounces.','Keep adjusting the feet instead of planting early.','Feeder randomizes the calls and the feed depth.'],score:['10 called balls · suggested','Count clean strikes made at the correct bounce count.'],cue:'Stay alive on the feet until the called bounce arrives—spacing keeps changing.',source:{label:'Coach Francis — “1 Bounce, 2 Bounce, 3 Bounce – Spacing Tennis Drill”',url:'https://www.youtube.com/shorts/vBOzKuNGnLM'}},
      {name:'Split-Step Machine Protocol',focus:'Movement',family:'splitMachine',players:1,goal:'Eliminate the two classic ball-machine habits: cheating the footwork and preparing late.',steps:['Use a ball machine for any groundstroke or volley feed.','Split-step on every feed even when direction is known.','Trigger the backswing as the ball leaves the machine.','Take real steps to and from each ball, then recover instead of waiting in place.'],score:['20-feed audit · suggested','Start from 20 and deduct a point for every missing split step or late preparation; finish at 18 or better.'],cue:'Treat the machine release like an opponent’s contact: split, turn, move, recover.',source:{label:'Top Tennis Training — “Tennis Ball Machine Drills – Improve Your Forehand, Backhand and Volleys”',url:'https://www.top-tennis-training.com/tennis-ball-machine-drills-improve-your-forehand-backhand-and-volleys/'}},
      {name:'1 Cross–1 Line On-the-Run Target',focus:'Points',family:'oneCrossOneLineTarget',goal:'Train one player to absorb pace on the move and still find a designated target.',steps:['Both players begin at the baseline; assign a dictator and a runner.','The dictator alternates one crosscourt and one down the line with real pace.','The runner returns every ball to one designated target, such as the dictator’s backhand.','Swap roles.'],score:['Race to 10 · suggested','Runner scores for target hits; dictator scores for forced errors.'],cue:'The moving player owns the target; the dictator keeps the alternating geometry honest.',source:{label:'Top Tennis Training — “Pro Tennis Drills - Train Like a Pro”',url:'https://www.youtube.com/watch?v=DL6elnRWo5o'}},
      {name:'Down-the-Middle Tempo Rally',focus:'Rally',family:'middleTempo',goal:'Build rally tolerance and depth by trading heavy balls down the middle.',steps:['Both players start at the baseline and rally every ball down the middle.','Each ball should bounce through the baseline area.','Increase pace gradually without losing the middle lane.','Reset the count when a ball lands short or leaves the lane.'],score:['Reach 20 · suggested','Count consecutive middle-deep balls; target 20.'],cue:'Build pace only after the middle lane and deep bounce are stable.',source:{label:'Top Tennis Training — “Pro Tennis Drills - Train Like a Pro”',url:'https://www.youtube.com/watch?v=DL6elnRWo5o'}},
      {name:'King of the Court',focus:'Points',family:'kingCourt',players:4,goal:'Survive as king under constant challenger pressure, with a natural handicap for mixed levels.',steps:['One player starts as king; two or more challengers queue on the opposite side.','A challenger plays a point against the king from a feed or serve.','A challenger must win three points in a row to take the king side.','Loser rotates out and the next challenger steps in immediately.'],score:['Bank king-side points','Most total points won while standing on the king side when time expires wins.'],cue:'Challengers need a three-point run; the king wins by breaking momentum early.',source:{label:'CV Tennis — practice games',url:'https://d15e2q48j6u4k5.cloudfront.net/websites/merchant/golf/downloads/CV%20Tennis.pdf'}},
      {name:'Tag Team Singles',focus:'Points',family:'tagTeam',players:4,goal:'Keep a group moving while making every player accountable for one quality hit.',steps:['Make two lines behind the middle of opposite baselines; one player starts up on each side.','The two up players begin a rally.','Each player hits exactly once, then sprints to the back of the line.','The next player takes the next ball; continue until a miss.'],score:['Line-vs-line tally','Each line earns points from won rallies; the higher total at the time limit wins.'],cue:'Hit, clear the lane, and trust the next teammate—no second touch.',source:{label:'USTA — “Tennis Games and Activities for Organized Play”',url:'https://usta725.americaneagle.com/assets/840/15/Tennis_Games_and_Activities_for_Organized_Play.pdf'}},
      {name:'Live Ball Doubles',focus:'Points',family:'liveBallDoubles',players:4,goal:'Sustain focus across two simultaneous rallies, then switch instantly into a live doubles point.',steps:['Two pairs begin simultaneous full-court crosscourt rallies: one forehand diagonal and one backhand diagonal.','When one ball ends, the first player to notice calls “live ball.”','The other ball immediately becomes a full doubles point.','Both the finished rally and live doubles point count, then restart with two balls.'],score:['First team to 11 · suggested','Count the initial rally point and the live-ball point; first team to 11 total wins.'],cue:'Track both balls until one dies, then reorganize around the survivor instantly.',source:{label:'CV Tennis — practice games',url:'https://d15e2q48j6u4k5.cloudfront.net/websites/merchant/golf/downloads/CV%20Tennis.pdf'}},
      {name:'Skinny Singles',focus:'Points',family:'skinnySingles',goal:'Compress singles into half the court to sharpen the serve, return, closing move, and third-shot response.',steps:['Use one half of the doubles court; wrong-half balls are out.','Player 1 serves deep; Player 2 returns deep and moves to the net.','Player 1 attempts a third-shot drop, then play the point out.','Alternate sides and rotate serve after each point.'],score:['Rally scoring to 11','Play to 11, or to 8 when other players are waiting.'],cue:'The narrow court magnifies height and depth—use the return to earn the net.',source:{label:'PEM Pickleball — “Skills & Drills (3.5)”',url:'https://www.pempickleball.com/uploads/1/0/4/7/10477134/skills___drills__3.5_.pdf'}},
      {name:'Ghost Doubles',focus:'Doubles',family:'ghostDoubles',goal:'Master half-court doubles through two different point constraints.',steps:['Use one half of the doubles court; balls in the other half are out.','Serve-and-volley edition: the server must charge the net after every serve.','Backcourt edition: with no net players, server and returner play the entire point diagonally crosscourt.','Play to 10, then reverse roles or switch halves.'],score:['First to 10 per edition','Complete both editions, reverse roles, and compare results.'],cue:'The half court removes escape routes—commit to the edition’s tactical demand.',source:{label:'MyTennisLessons — “Tennis Drills”',url:'https://mytennislessons.com/blog/?p=9',extra:{label:'ALTA Net News — “Doubles Science – The Backcourt”',url:'https://www.netnewsmag.com/articles/doubles-science-the-backcourt/'}}},
      {name:'No-Alley Doubles',focus:'Doubles',family:'noAlleyDoubles',players:4,goal:'Engrain the high-percentage doubles shot down the middle by removing the alleys.',steps:['All four players begin on the baseline; both doubles alleys are out.','Feed to one side and play the point within the narrowed court.','For a variation, narrow the court further with spots or start all four on the service line.','Rotate players through all positions.'],score:['Race to 7 or 11','Keep score and rotate when a team reaches the agreed target.'],cue:'With the alleys removed, work through the center seam and move as a pair.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}},
      {name:'One-Bounce Doubles',focus:'Doubles',family:'oneBounceDoubles',players:4,goal:'Force both teams to rush the net behind serve and return.',steps:['Begin in normal doubles positions and start each point with a serve.','After the return, each team is allowed only one bounce total for the rest of the point.','The return itself does not count as the returning team’s bounce.','A team that lets a second ball bounce loses the point.'],score:['Timed point tally','Keep normal point totals; the team with the most when time expires wins.'],cue:'Use the one allowed bounce to transition—after that, own the air together.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}},
      {name:'Fly Drill',focus:'Doubles',family:'flyDoubles',players:4,goal:'Steal time from opponents by taking every ball in the air.',steps:['Two players begin on the service line against two on the baseline; the baseline team feeds.','The net team must take every ball in the air—one bounce loses the point.','Optional reset: after a bounce, sprint to the baseline and close again behind an approach volley.','Swap the up and back teams.'],score:['Up-vs-back tally','Keep score across points and compare totals after swapping roles.'],cue:'Split together and own the air; a passive step turns the constraint against you.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}},
      {name:'Go Drill',focus:'Doubles',family:'goDoubles',players:4,goal:'Make attacking the short ball and crashing the net automatic for all four players.',steps:['Both doubles teams begin on opposing baselines and start a groundstroke point from a feed.','All four stay back until a ball lands on the service line or inside the service box.','Anyone calls “go,” and all four players crash the net.','Play the point out from there.'],score:['Three-point conversion','The team receiving the first short ball earns 3 if it wins; every other point is worth 1.'],cue:'The short bounce is a shared trigger—call it early and move as a unit.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}},
      {name:'Staggered Overheads',focus:'Doubles',family:'staggeredOverheads',players:4,goal:'Train the non-hitting partner to close hard and pick off the weak reply to a smash.',steps:['Two players begin on the service line against two on the opposing baseline.','Feed an overhead to one net player.','As that player smashes, the partner closes and shades toward the middle for the likely weak reply.','Play the point out; the retrieving side avoids the closer.'],score:['Partner-touch rule','For the hard variation, the net team loses if the smasher’s partner does not touch the next ball.'],cue:'One player hits the overhead; the partner owns the next reply and the middle.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}},
      {name:'Bryan Volley Placement Menu',focus:'Touch',family:'volleyPlacementMenu',goal:'Make the finishing volley a placement choice rather than a hit-and-hope.',steps:['One player feeds from the baseline while the other starts at net.','Before each feed, call one finish: sharp angle, drop volley, hard deep corner, or soft deep corner.','The net player must execute the called placement.','Rotate roles after the target set.'],score:['First to 10 · suggested','Earn 1 for each correctly executed called placement.'],cue:'Hear the target, show the same preparation, then shape the finish with the racquet face.',source:{label:'Tennis.com — “Six lessons you can learn from Bob and Mike Bryan”',url:'https://www.tennis.com/news/articles/bob-mike-bryan-brothers-six-lessons-you-can-learn'}},
      {name:'Goalie',focus:'Defense',family:'goalie',players:4,goal:'Learn to reflex a smash back instead of giving up on a short lob.',steps:['Four players begin on opposing service lines; mark a goal about two feet inside each singles sideline on one side.','Feed a lob to the non-goalie side; that team smashes toward the marked goal.','Goalies retreat one or two steps, reverse split-step on contact, and reflex-volley or half-volley the smash.','Once the smash is returned, all four close and play out the point.'],score:['Game to 7 or 11','Use the narrowed goal for the smash and play standard points to the agreed target.'],cue:'Back up before contact, reverse split, and present a stable face to the smash.',source:{label:'TennisOne — “Top Seven On-Court Drills for Developing Sound Doubles Tactics”',url:'https://tennisone.tennisplayer.net/club/lessons/brouwer/seven/drills.php'}}

    function persistState() {

    function makeChips(container, options, type) {
      container.innerHTML = options.map(o => `<button class="chip ${o === 'All' ? 'active' : ''}" type="button" data-${type}="${o}">${o}</button>`).join('');
      container.addEventListener('click', e => {
        const button = e.target.closest('.chip'); if (!button) return;
        container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        button.classList.add('active');
        activeFocus = button.dataset.focus;
        shuffle(true);
        persistState();
      });
    }

    function matches(d) {
      const playerMatch = d.players === activePlayers;
      const focusMatch = activeFocus === 'All' || (activeFocus === 'Favorites' ? favorites.has(d.id) : d.category === activeFocus);
      return playerMatch && focusMatch;
    }

    function randomFrom(list) { return list[Math.floor(Math.random() * list.length)]; }

    function updateFavoriteButton() {
      const isFavorite = Boolean(currentId && favorites.has(currentId));
      $('favoriteToggle').classList.toggle('active', isFavorite);
      $('favoriteToggle').setAttribute('aria-pressed', String(isFavorite));
      $('favoriteToggle').setAttribute('aria-label', isFavorite ? 'Remove drill from favorites' : 'Add drill to favorites');
      $('favoriteToggle').title = isFavorite ? 'Remove from favorites' : 'Favorite this drill';
    }

    function updateRotationCount(pool) {
      const label = activeFocus === 'Favorites'
        ? `${pool.length} favorite drill${pool.length === 1 ? '' : 's'}`
        : `${pool.length} distinct drill${pool.length === 1 ? '' : 's'}`;
      $('countLabel').textContent = `${label} · ${activePlayers} player${activePlayers === 1 ? '' : 's'}`;
    }

    function shuffle(fromFilter = false) {
      const pool = drills.filter(matches);
      updateRotationCount(pool);
      if (!pool.length) {
        $('drillContent').style.display = 'none';
        $('emptyState').style.display = 'block';
        $('emptyState').querySelector('p').textContent = activeFocus === 'Favorites'
          ? `Favorite a ${activePlayers}-player drill, or choose another player count.`
          : `No ${activePlayers}-player drills match this filter yet.`;
        return;
      }
      $('drillContent').style.display = '';
      $('emptyState').style.display = 'none';
      let candidates = pool.filter(d => d.id !== currentId && !recent.includes(d.id));
      if (!candidates.length) candidates = pool.filter(d => d.id !== currentId);
      if (!candidates.length) candidates = pool;
      const next = currentId === null && fromFilter ? pool[0] : randomFrom(candidates);
      currentId = next.id;
      recent = [next.id, ...recent].slice(0, Math.min(8, pool.length - 1));
      render(next);
      if (!fromFilter) {
        $('drillContent').classList.remove('flash');
        void $('drillContent').offsetWidth;
        $('drillContent').classList.add('flash');
      }
    }

    function render(d) {
      currentDrill = d;
      scoreIndex = 0;
      $('contextText').textContent = `${d.players} player${d.players === 1 ? '' : 's'} · ${d.time} min`;
      $('tags').innerHTML = `<span class="tag primary">${d.category}</span><span class="tag">${d.level}</span><span class="tag">${d.players} players</span>`;
      $('drillName').textContent = d.name;
      $('goal').textContent = d.goal;
      $('setupSteps').innerHTML = d.setup.map(s => `<li>${s}</li>`).join('');
      $('steps').innerHTML = d.steps.map(s => `<li>${s}</li>`).join('');
      renderScore();
      $('cue').textContent = d.cue;
      $('partnerKey').style.display = d.players === 1 ? 'none' : '';
      $('courtDesc').textContent = `Court diagram for ${d.name}, showing players, targets, and ball directions.`;
      const sourceNote = $('sourceNote');
      if (d.source) {
        sourceNote.innerHTML = `Source: <a href="${d.source.url}" target="_blank" rel="noopener noreferrer">${d.source.label}</a>${d.source.extra ? ` · <a href="${d.source.extra.url}" target="_blank" rel="noopener noreferrer">${d.source.extra.label}</a>` : ''}`;
        sourceNote.style.display = 'block';
      } else {
        sourceNote.textContent = '';
        sourceNote.style.display = 'none';
      }
      updateFavoriteButton();
      renderDiagram(d.family, d.players);
    }

    function renderScore(direction = 0) {
      if (!currentDrill) return;
      const options = currentDrill.scoring;
      scoreIndex = (scoreIndex + direction + options.length) % options.length;
      const option = options[scoreIndex];
      $('scoreVariantLabel').textContent = `${option.label} · ${scoreIndex + 1} of ${options.length}`;
      $('scoreTitle').textContent = option.title;
      $('scoreText').textContent = option.text;
      $('scoreDots').innerHTML = options.map((_, i) => `<button class="score-dot ${i === scoreIndex ? 'active' : ''}" type="button" data-score-index="${i}" aria-label="Show scoring option ${i + 1}" aria-pressed="${i === scoreIndex}"></button>`).join('');
      const copy = $('scoreCopy');
      copy.classList.remove('score-slide');
      void copy.offsetWidth;
      copy.classList.add('score-slide');
    }

    function renderDiagram(family, players) {
      stopAnimation();
      const items = (diagrams[family] || diagrams.cross).filter(item => players !== 1 || item[0] !== 'o');
      $('diagram').innerHTML = items.map((item, index) => {
        const [type,...n] = item;
        if (type === 'p') return `<g class="player-marker" data-role="you"><circle cx="${n[0]}" cy="${n[1]}" r="10" class="player"/><circle cx="${n[0]}" cy="${n[1]-17}" r="5" class="player"/></g>`;
        if (type === 'o') return `<g class="player-marker" data-role="partner"><circle cx="${n[0]}" cy="${n[1]}" r="10" class="partner"/><circle cx="${n[0]}" cy="${n[1]-17}" r="5" class="partner"/></g>`;
        if (type === 't') return `<rect x="${n[0]}" y="${n[1]}" width="${n[2]}" height="${n[3]}" rx="8" class="target"/>`;
        const ret = type === 'r';
        return `<path id="shot-${index}" data-hitter="${ret ? 'partner' : 'you'}" d="M${n[0]} ${n[1]} Q${(n[0]+n[2])/2 + (ret?-22:22)} ${(n[1]+n[3])/2} ${n[2]} ${n[3]}" class="arrow shot-path ${ret?'return-arrow':''}" marker-end="url(#${ret?'returnHead':'arrowHead'})"/>`;
      }).join('');
      animationState.sequence = [...document.querySelectorAll('#diagram .shot-path')].map(path => ({
        path,
        hitter:path.dataset.hitter,
        length:path.getTotalLength(),
        duration:Math.max(560, Math.min(1050, path.getTotalLength() * 2.25))
      }));
      animationState.segment = -1;
      animationState.startedAt = 0;
      setMotionButton();
      if (!reducedMotion.matches && animationState.inView && !animationState.paused && !document.hidden) startAnimation();
    }

    function pulseHitter(role) {
      document.querySelectorAll('.player-marker.hit').forEach(el => el.classList.remove('hit'));
      const marker = document.querySelector(`.player-marker[data-role="${role}"]`) || document.querySelector('.player-marker[data-role="you"]');
      if (!marker) return;
      void marker.getBBox();
      marker.classList.add('hit');
    }

    function placeBall(path, progress) {
      const point = path.getPointAtLength(path.getTotalLength() * Math.max(0, Math.min(1, progress)));
      $('animatedBall').setAttribute('transform', `translate(${point.x} ${point.y})`);
    }

    function animationFrame(now) {
      animationState.raf = 0;
      if (animationState.paused || reducedMotion.matches || !animationState.inView || document.hidden || !animationState.sequence.length) return;
      if (!animationState.startedAt) animationState.startedAt = now;
      const shotGap = 150;
      const loopPause = 850;
      const cycle = animationState.sequence.reduce((sum, shot) => sum + shot.duration + shotGap, 0) + loopPause;
      let elapsed = (now - animationState.startedAt) % cycle;
      let chosen = animationState.sequence.length - 1;
      let progress = 1;
      for (let i = 0; i < animationState.sequence.length; i++) {
        const shot = animationState.sequence[i];
        if (elapsed <= shot.duration) {
          chosen = i;
          progress = elapsed / shot.duration;
          break;
        }
        elapsed -= shot.duration;
        if (elapsed <= shotGap) {
          chosen = i;
          progress = 1;
          break;
        }
        elapsed -= shotGap;
      }
      const shot = animationState.sequence[chosen];
      if (chosen !== animationState.segment) {
        animationState.segment = chosen;
        pulseHitter(shot.hitter);
      }
      placeBall(shot.path, progress);
      animationState.raf = requestAnimationFrame(animationFrame);
    }

    function startAnimation(restart = false) {
      if (restart) { animationState.startedAt = 0; animationState.segment = -1; }
      if (!animationState.raf && !animationState.paused && !reducedMotion.matches && animationState.inView && !document.hidden) {
        animationState.raf = requestAnimationFrame(animationFrame);
      }
    }

    function stopAnimation() {
      if (animationState.raf) cancelAnimationFrame(animationState.raf);
      animationState.raf = 0;
    }

    function setMotionButton() {
      const paused = animationState.paused;
      $('motionToggle').setAttribute('aria-label', paused ? 'Play drill animation' : 'Pause drill animation');
      $('motionToggle').title = paused ? 'Play animation' : 'Pause animation';
      $('motionIcon').innerHTML = paused ? '<path d="M6 3.5 16 10 6 16.5z"/>' : '<path d="M5 3h3v14H5zM12 3h3v14h-3z"/>';
    }

    $('scorePrev').addEventListener('click', () => renderScore(-1));
    $('scoreNext').addEventListener('click', () => renderScore(1));
    $('scoreDots').addEventListener('click', e => {
      const dot = e.target.closest('[data-score-index]');
      if (!dot || !currentDrill) return;
      scoreIndex = Number(dot.dataset.scoreIndex);
      renderScore();
    });
    let scoreSwipeX = null;
    $('scorebox').addEventListener('pointerdown', e => { scoreSwipeX = e.clientX; });
    $('scorebox').addEventListener('pointerup', e => {
      if (scoreSwipeX === null) return;
      const delta = e.clientX - scoreSwipeX;
      scoreSwipeX = null;
      if (Math.abs(delta) > 38) renderScore(delta < 0 ? 1 : -1);
    });
    $('scorebox').addEventListener('pointercancel', () => { scoreSwipeX = null; });
    $('motionToggle').addEventListener('click', () => {
      animationState.paused = !animationState.paused;
      if (animationState.paused) stopAnimation();
      else startAnimation(true);
      setMotionButton();
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stopAnimation() : startAnimation());
    reducedMotion.addEventListener?.('change', () => reducedMotion.matches ? stopAnimation() : startAnimation(true));
    new IntersectionObserver(entries => {
      animationState.inView = entries[0]?.isIntersecting !== false;
      if (animationState.inView) startAnimation(); else stopAnimation();
    }, {threshold:.08}).observe($('drillCard'));

    $('playerCount').addEventListener('change', e => {
      activePlayers = Number(e.target.value);
      currentId = null;
      recent = [];
      shuffle(true);
      persistState();
    });
    $('favoriteToggle').addEventListener('click', () => {
      if (!currentId) return;
      if (favorites.has(currentId)) favorites.delete(currentId);
      else favorites.add(currentId);
      updateFavoriteButton();
      const pool = drills.filter(matches);
      updateRotationCount(pool);
      if (activeFocus === 'Favorites' && !favorites.has(currentId)) shuffle(true);
      persistState();
    });
    $('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      $('themeToggle').setAttribute('aria-label', next === 'dark' ? 'Use light mode' : 'Use dark mode');
      persistState();
    });
    $('shuffle').addEventListener('click', () => shuffle(false));
    $('resetFilters').addEventListener('click', () => {
      activeFocus = 'All';
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === 'All'));
      shuffle(true);
      persistState();
    });
    makeChips($('focusChips'), focusOptions, 'focus');
    // Apply any restored state to the controls before the first render.
    $('playerCount').value = String(activePlayers);
    document.querySelectorAll('#focusChips .chip').forEach(c => c.classList.toggle('active', c.dataset.focus === activeFocus));
    const bootTheme = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    $('themeToggle').setAttribute('aria-label', bootTheme === 'dark' ? 'Use light mode' : 'Use dark mode');
    persistState();
    shuffle(true);
  </script>
</body>
</html>
